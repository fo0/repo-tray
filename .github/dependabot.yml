# Monthly, one grouped PR per ecosystem. Workflow actions are pinned to full SHAs
# with a version comment, which Dependabot updates together. The cooldown keeps
# versions younger than a week out of version updates; security updates skip it.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    commit-message:
      prefix: ci(deps)
    groups:
      github-actions:
        patterns: ['*']
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    commit-message:
      prefix: chore(deps)
    groups:
      npm:
        patterns: ['*']
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    commit-message:
      prefix: chore(deps)
    groups:
      cargo:
        patterns: ['*']
