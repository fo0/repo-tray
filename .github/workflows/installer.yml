name: Installer
# Builds an unsigned Windows validation installer from any branch for manual testing.
# It publishes nothing; releases come only from the Release workflow.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: installer-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install Rust stable
        run: rustup toolchain install stable --profile minimal --no-self-update && rustup default stable
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri -> target
          # Shared with Release: both build the optimized desktop binary.
          shared-key: windows-installer
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:installer
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: RepoTray-Windows-validation-unsigned
          path: src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 14
          if-no-files-found: error
