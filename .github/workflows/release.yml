name: Release
on:
  workflow_dispatch:
    inputs:
      existing_tag:
        description: Publish an already built draft (leave empty for a new build)
        required: false
        type: string
  workflow_run:
    workflows: [Checks]
    types: [completed]
    branches: [main]
permissions:
  contents: read
jobs:
  windows-release:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.existing_tag == '') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       contains(github.event.workflow_run.head_commit.message, '[release]'))
    runs-on: windows-latest
    timeout-minutes: 90
    # Job-level, not workflow-level: every Checks completion on main starts a Release
    # run, and a workflow-level group would let a later no-op run displace a pending
    # real release before the job conditions are evaluated.
    concurrency:
      group: repotray-release
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read # Read this run's immutable created_at for retry-stable versions.
    env:
      RELEASE_SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Prepare automatic release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ($env:GITHUB_REF -ne 'refs/heads/main') { throw 'Release must be started from main' }
          if ($env:RELEASE_SOURCE_SHA -ne (git rev-parse HEAD)) { throw 'Checkout differs from release source' }
          git merge-base --is-ancestor HEAD origin/main
          if ($LASTEXITCODE -ne 0) { throw 'Release must be on main' }
          New-Item -ItemType Directory -Force release-work | Out-Null
          $createdAt = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID" --jq '.created_at'
          if ($LASTEXITCODE -ne 0) { throw 'Run timestamp unavailable' }
          node scripts/release.mjs plan $createdAt $env:RELEASE_SOURCE_SHA release-work/release-meta.json
          if ($LASTEXITCODE -ne 0) { throw 'Release version generation failed' }
          $metadata = Get-Content release-work/release-meta.json -Raw | ConvertFrom-Json
          $existingTag = git tag --list $metadata.tag
          if ($LASTEXITCODE -ne 0 -or $existingTag) { throw 'Release tag already exists or cannot be checked' }
          gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" --paginate --slurp | Out-File -Encoding utf8 release-work/release-history.json
          if ($LASTEXITCODE -ne 0) { throw 'Release history unavailable' }
          node scripts/release.mjs check-history release-work/release-meta.json release-work/release-history.json
          if ($LASTEXITCODE -ne 0) { throw 'Release exists or would downgrade latest' }
          gh api --method POST "repos/$env:GITHUB_REPOSITORY/releases/generate-notes" --raw-field "tag_name=$($metadata.tag)" --raw-field "target_commitish=$env:RELEASE_SOURCE_SHA" --jq '.body' | Out-File -Encoding utf8 release-work/generated-notes.md
          if ($LASTEXITCODE -ne 0) { throw 'Automatic changelog generation failed' }
          node scripts/release.mjs prepare release-work/release-meta.json release-work/generated-notes.md release-work/release-notes.md
          if ($LASTEXITCODE -ne 0) { throw 'Release preflight failed' }
          "RELEASE_TAG=$($metadata.tag)" | Out-File -Encoding utf8 -Append $env:GITHUB_ENV
          "RELEASE_VERSION=$($metadata.version)" | Out-File -Encoding utf8 -Append $env:GITHUB_ENV
          "RELEASE_TITLE=$($metadata.title)" | Out-File -Encoding utf8 -Append $env:GITHUB_ENV
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri -> target
          shared-key: windows-installer
          cache-bin: false
          save-if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - run: pnpm exec playwright install chromium
      - run: pnpm test:e2e
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml --no-default-features --features network,native-credentials
      - run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --no-default-features --features network,native-credentials --all-targets -- -D warnings
      - name: Build unsigned Windows installer
        id: installer
        run: pnpm tauri build --features desktop --bundles nsis --config src-tauri/tauri.release.conf.json
      - name: Verify installer download and publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = $env:RELEASE_VERSION
          $installer = "src-tauri/target/release/bundle/nsis/RepoTray_${version}_x64-setup.exe"
          if (!(Test-Path $installer)) { throw 'Installer missing' }
          gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" --paginate --slurp | Out-File -Encoding utf8 release-work/release-history.json
          if ($LASTEXITCODE -ne 0) { throw 'Release history unavailable' }
          node scripts/release.mjs check-history release-work/release-meta.json release-work/release-history.json
          if ($LASTEXITCODE -ne 0) { throw 'Release exists or would downgrade latest' }
          $remoteTag = git ls-remote --refs --tags origin "refs/tags/$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0 -or $remoteTag) { throw 'Release tag appeared during build or cannot be checked' }
          gh release create $env:RELEASE_TAG $installer --target $env:RELEASE_SOURCE_SHA --title $env:RELEASE_TITLE --notes-file release-work/release-notes.md --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release creation/upload failed' }
          $isDraft = gh release view $env:RELEASE_TAG --json isDraft --jq '.isDraft'
          if ($LASTEXITCODE -ne 0 -or $isDraft -ne 'false') { throw 'Release was not published' }
          $filename = Split-Path $installer -Leaf
          gh release download $env:RELEASE_TAG --pattern $filename --dir release-work/download-check
          if ($LASTEXITCODE -ne 0) { throw 'Release exists, but download verification failed' }
          $downloaded = Join-Path release-work/download-check $filename
          if ((Get-FileHash $downloaded -Algorithm SHA256).Hash -ne (Get-FileHash $installer -Algorithm SHA256).Hash) { throw 'Release exists, but downloaded installer differs' }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.installer.outcome == 'success'
        with:
          name: RepoTray-Windows-release
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  publish-existing:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.existing_tag != '') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       contains(github.event.workflow_run.head_commit.message, '[publish-existing:'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Same group as windows-release (see the note there).
    concurrency:
      group: repotray-release
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      EXISTING_TAG: ${{ inputs.existing_tag }}
      REQUEST_MESSAGE: ${{ github.event.workflow_run.head_commit.message }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Download and publish the already built EXE
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -ne 'refs/heads/main') { throw 'Publish from main only' }
          $tag = $env:EXISTING_TAG
          if (!$tag) {
            $match = [regex]::Match($env:REQUEST_MESSAGE, '\[publish-existing:(v[0-9]+\.[0-9]+\.[0-9]+)\]')
            if (!$match.Success) { throw 'Existing release tag missing' }
            $tag = $match.Groups[1].Value
          }
          if ($tag -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') { throw 'Invalid release tag' }
          # Read the REST response directly: gh release view has no databaseId field.
          $json = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$tag"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot read existing release' }
          $release = $json | ConvertFrom-Json
          if ($release.tag_name -ne $tag -or $release.prerelease) { throw 'Release does not match the requested stable tag' }
          # Prefer an existing tag. A draft may have uploaded assets before its tag exists.
          $tagRef = git ls-remote --refs --tags origin "refs/tags/$tag"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect release tag' }
          if ($tagRef) {
            git fetch --no-tags origin "refs/tags/$tag"
          } elseif ($release.draft) {
            $target = $release.target_commitish
            # Our generated notes retain the exact build source, when available.
            if ($release.body -match '(?m)^Source: ([a-f0-9]{40})\r?$') { $target = $Matches[1] }
            if ($target -notmatch '^[a-f0-9]{40}$') {
              if (!$target.StartsWith('refs/heads/')) { $target = "refs/heads/$target" }
              git check-ref-format $target
              if ($LASTEXITCODE -ne 0) { throw 'Invalid draft release target' }
            }
            git fetch --no-tags origin $target
          } else {
            throw 'Published release tag is missing'
          }
          if ($LASTEXITCODE -ne 0) { throw 'Cannot fetch release source' }
          $source = git rev-parse --verify 'FETCH_HEAD^{commit}'
          if ($LASTEXITCODE -ne 0) { throw 'Cannot resolve release source' }
          git merge-base --is-ancestor $source origin/main
          if ($LASTEXITCODE -ne 0) { throw 'Release source is outside main' }
          $filename = "RepoTray_$($tag.Substring(1))_x64-setup.exe"
          $assets = @($release.assets | Where-Object { $_.name -eq $filename })
          if ($assets.Count -ne 1 -or $assets[0].size -le 0) { throw 'Expected one built Windows EXE' }
          gh release download $tag --pattern $filename --dir release-work
          if ($LASTEXITCODE -ne 0) { throw 'Cannot download built EXE' }
          $downloaded = Get-Item (Join-Path release-work $filename)
          if ($downloaded.Length -ne $assets[0].size) { throw 'Downloaded EXE size differs from GitHub asset' }
          $hash = (Get-FileHash $downloaded.FullName -Algorithm SHA256).Hash.ToLower()
          # Older GitHub assets may have no digest. Validate it whenever supplied.
          if ($assets[0].digest -and $assets[0].digest -ne "sha256:$hash") { throw 'Downloaded EXE hash differs from GitHub asset' }
          if ($release.draft) {
            gh release edit $tag --target $source --draft=false --latest
            if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
          }
          $publishedJson = gh release view $tag --json isDraft,tagName,url
          if ($LASTEXITCODE -ne 0) { throw 'Cannot confirm release publication' }
          $published = $publishedJson | ConvertFrom-Json
          if ($published.isDraft -or $published.tagName -ne $tag) { throw 'Release was not published' }
          Write-Output $published.url
