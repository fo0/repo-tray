name: Checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      build_installer:
        description: Build an unsigned Windows validation installer
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  # PR runs share a group per ref so a new push supersedes the old run. Every other
  # run gets its own group: GitHub would otherwise cancel a pending main run (and the
  # Release it should trigger) or a queued manual installer build.
  group: checks-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  panel:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: Upload Playwright report (on failure)
        if: ${{ !cancelled() && failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
  rust-core:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri -> target
          shared-key: linux-core
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml --no-default-features --features network,native-credentials
      - run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --no-default-features --features network,native-credentials --all-targets -- -D warnings
  windows-desktop:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri -> target
          # Keep check-only caches from occupying the installer cache key.
          shared-key: ${{ github.event_name == 'workflow_dispatch' && inputs.build_installer && 'windows-installer' || 'windows-check' }}
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm icons:check
      - run: pnpm release:test
      - run: pnpm lint
      - run: pnpm build
      - run: cargo check --locked --manifest-path src-tauri/Cargo.toml --features desktop
      - name: Test Windows popup and isolated autostart registry adapter
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --features desktop --bin repotray
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml --no-default-features --features network,native-credentials
      - name: Build unsigned validation installer (manual only)
        if: github.event_name == 'workflow_dispatch' && inputs.build_installer
        run: pnpm build:installer
      - name: Upload unsigned validation installer (manual only)
        if: github.event_name == 'workflow_dispatch' && inputs.build_installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: RepoTray-Windows-validation-unsigned
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
