name: Checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      build_installer:
        description: Build an unsigned Windows validation installer
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  panel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
  rust-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          workspaces: src-tauri -> target
          shared-key: linux-core
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml --no-default-features --features network,native-credentials
      - run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --no-default-features --features network,native-credentials --all-targets -- -D warnings
  windows-desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          workspaces: src-tauri -> target
          # Keep check-only caches from occupying the installer cache key.
          shared-key: ${{ github.event_name == 'workflow_dispatch' && inputs.build_installer && 'windows-installer' || 'windows-check' }}
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm icons:check
      - run: pnpm release:test
      - run: pnpm lint
      - run: pnpm build
      - run: cargo check --locked --manifest-path src-tauri/Cargo.toml --features desktop
      - name: Test native Windows popup placement and window ownership
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --features desktop --bin repotray
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml --no-default-features --features network,native-credentials
      - name: Build unsigned validation installer (manual only)
        if: github.event_name == 'workflow_dispatch' && inputs.build_installer
        run: pnpm build:installer
      - name: Upload unsigned validation installer (manual only)
        if: github.event_name == 'workflow_dispatch' && inputs.build_installer
        uses: actions/upload-artifact@v4
        with:
          name: RepoTray-Windows-validation-unsigned
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
